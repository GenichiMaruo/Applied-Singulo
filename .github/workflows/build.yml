name: Build
on:
  push:
    branches: ['26.1.2', 'port/26.1.2']
  pull_request:
    branches: ['26.1.2']
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      # Downloads only official, SHA-256-pinned JARs. A pending-public dependency may be tested,
      # but no release receipt is produced until general availability is verified.
      - name: Test publication safety contracts (offline)
        run: python3 -B -m unittest discover -s tools -p 'test_*.py'
      - run: python3 tools/fetch_dependencies.py
      - name: Build and test the addon with real dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash gradlew --no-daemon build
          python3 tools/check_distribution.py
          bash gradlew --no-daemon runGameTestServer 2>&1 | tee build/integration-gametest.log
          python3 tools/check_gametest_log.py build/integration-gametest.log
      - name: Prepare receipt only after dependency publication
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess
          pins = json.load(open('tools/dependencies.json'))
          if any(p.get('unreleased') for p in pins.values()):
              print('Release receipt withheld: dependency general publication is still pending')
          else:
              subprocess.run(['python3', 'tools/prepare_release.py'], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: applied-singulo-development
          path: |
            build/libs/Applied-Singulo-*.jar
            build/integration-gametest.log
            build/release-manifest.json
          if-no-files-found: error
