name: Build
on:
  push:
    branches: ['1.21.1', 'feature/**', 'fix/**']
  pull_request:
    branches: ['1.21.1']
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      # Downloads AE2 19.2.19 and GuideME 21.1.1 and verifies their pinned SHA-256. The unreleased Singulo 0.19.0
      # is fetched at its pinned commit from GitHub and built by the Gradle fetchDependencies task (not yet run in CI).
      - run: python3 tools/fetch_dependencies.py
      - name: Build and test the addon with real dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash gradlew --no-daemon build
          python3 tools/check_distribution.py
          bash gradlew --no-daemon runGameTestServer 2>&1 | tee build/integration-gametest.log
          python3 tools/check_gametest_log.py build/integration-gametest.log
      - uses: actions/upload-artifact@v4
        with:
          name: applied-singulo-development
          path: |
            build/libs/Applied-Singulo-*.jar
            build/integration-gametest.log
            build/release-manifest.json
          if-no-files-found: error
