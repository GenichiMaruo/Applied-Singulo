name: Build
on:
  push:
    branches: ['1.21.1', 'feature/**', 'fix/**']
  pull_request:
    branches: ['1.21.1']
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # This API commit must be pushed before this development change is pushed.
      - uses: actions/checkout@v4
        with:
          repository: GenichiMaruo/Singulo
          ref: 466101f6de5d39288977bbe2e0ae2ee6c084a315
          path: .ci/singulo
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build pinned base API (not a publication artifact)
        run: bash .ci/singulo/gradlew -p .ci/singulo --no-daemon jar
      - run: python3 tools/fetch_dependencies.py
      - name: Build and test the addon with real dependencies
        shell: bash
        run: |
          set -euo pipefail
          args=(-PsinguloJar="$PWD/.ci/singulo/build/libs/Singulo-0.18.0-1.21.1N.jar" -Pae2Jar="$PWD/libs/appliedenergistics2-19.2.19.jar" -PguideMeJar="$PWD/libs/guideme-21.1.1.jar")
          bash gradlew --no-daemon build "${args[@]}"
          python3 tools/check_distribution.py
          bash gradlew --no-daemon runGameTestServer "${args[@]}" 2>&1 | tee build/integration-gametest.log
          python3 tools/check_gametest_log.py build/integration-gametest.log
      - uses: actions/upload-artifact@v4
        with:
          name: applied-singulo-development
          path: |
            build/libs/Applied-Singulo-*.jar
            build/integration-gametest.log
          if-no-files-found: error
# Local API commit dependency: this workflow has not yet run remotely.
