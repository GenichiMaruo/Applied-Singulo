name: Build 1.20.1
on:
  push:
    branches: ['1.20.1', 'feature/**', 'fix/**']
  pull_request:
    branches: ['1.20.1']
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        loader: [forge, neoforge]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 tools/fetch_dependencies.py
      - name: Build and test with real dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash gradlew --no-daemon fetchDependencies -Ploader=${{ matrix.loader }}
          bash gradlew --no-daemon build -Ploader=${{ matrix.loader }}
          python3 tools/check_distribution.py --loader ${{ matrix.loader }}
          bash gradlew --no-daemon runGameTestServer -Ploader=${{ matrix.loader }} 2>&1 | tee build/${{ matrix.loader }}/integration-gametest.log
          python3 tools/check_gametest_log.py build/${{ matrix.loader }}/integration-gametest.log
          python3 tools/prepare_release.py --loader ${{ matrix.loader }}
      - uses: actions/upload-artifact@v4
        with:
          name: applied-singulo-1.20.1-${{ matrix.loader }}-development
          path: |
            build/${{ matrix.loader }}/libs/Applied-Singulo-*.jar
            build/${{ matrix.loader }}/integration-gametest.log
            build/${{ matrix.loader }}/release-manifest.json
          if-no-files-found: error
