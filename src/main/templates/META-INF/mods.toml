modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/GenichiMaruo/Applied-Singulo/issues"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="applied-singulo.png"
authors="${mod_authors}"
displayURL="https://github.com/GenichiMaruo/Applied-Singulo"
description="Singulo and AE2 integration addon. The Android ME Interface shares Singulo Recipe Rack crafting recipes with AE2 and has androids craft them from privately escrowed materials; the Android Crafting Bridge does the same for Pattern Provider patterns. Requires Singulo 0.19.0 (0.19 series)."

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="[${forge_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="singulo"
mandatory=true
versionRange="${singulo_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ae2"
mandatory=true
versionRange="${ae2_version_range}"
ordering="AFTER"
side="BOTH"

