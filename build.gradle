plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}
def selectedLoader = providers.gradleProperty('loader').getOrElse('neoforge')
if (!(selectedLoader in ['forge', 'neoforge'])) throw new GradleException('Use -Ploader=forge or -Ploader=neoforge')
def selectedSuffix = selectedLoader == 'forge' ? 'F' : 'N'
def selectedLoaderVersion = selectedLoader == 'forge' ? forge_version : neoforge_version
layout.buildDirectory = layout.projectDirectory.dir("build/${selectedLoader}")
version = mod_version
group = mod_group_id
base { archivesName = mod_archive_name }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
tasks.named('jar', Jar) {
    archiveFileName = "${mod_archive_name}-${mod_version}-${minecraft_version}${selectedSuffix}.jar"
    from('LICENSE')
    exclude 'io/github/genichimaruo/appliedsingulo/gametest/**'
    exclude 'data/applied_singulo/structures/empty.nbt'
}

// Development dependencies only; never bundled into the addon.
// tools/dependencies.json pins each mod either by official download URL + SHA-256, or (unreleased APIs)
// by an exact source commit that is built locally. Missing JARs are prepared in libs/ automatically, so
// `./gradlew runClient` needs no arguments. -P<property>=<jar> overrides one; overridden JARs are not
// checked and must not be used for publication.
def pinnedDependencies = new groovy.json.JsonSlurper().parse(file('tools/dependencies.json')).findAll { name, spec -> !spec.loader || spec.loader == selectedLoader }
def dependencyJar = { String name, Map spec ->
    providers.gradleProperty(spec.property).map { file(it) }.getOrElse(file("libs/${name}"))
}
def runCommand = { List<String> command, File dir ->
    def process = new ProcessBuilder(command.collect { it.toString() }).directory(dir).redirectErrorStream(true).start()
    // Drain nested Gradle output instead of inheriting the outer daemon's console pipe.
    process.inputStream.withReader('UTF-8') { reader -> reader.eachLine { logger.lifecycle(it) } }
    if (process.waitFor() != 0) throw new GradleException("Command failed (${process.exitValue()}): ${command.join(' ')}")
}
def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
// Unreleased dependency: `git archive` of the pinned commit (from a local clone if it has the commit,
// otherwise fetched from the repository), built with its own wrapper. A marker records the commit so a
// changed pin rebuilds. The local clone's working tree and branches are never touched.
def buildFromSource = { String name, Map spec ->
    def jar = file("libs/${name}")
    def marker = file("libs/${name}.commit")
    if (jar.isFile() && marker.isFile() && marker.text.trim() == spec.commit) return
    def src = file("build/dependency-src/${name - '.jar'}-${spec.commit.take(12)}")
    if (!new File(src, 'gradlew').isFile()) {
        project.delete(src)
        src.mkdirs()
        def zip = file("${src.path}.zip")
        def clone = file(spec.localClone ?: 'missing-clone')
        def hasCommit = new File(clone, '.git').exists() &&
            new ProcessBuilder(["git", "-C", clone.path, "cat-file", "-e", spec.commit + "^{commit}"]).start().waitFor() == 0
        if (hasCommit) {
            logger.lifecycle("Archiving ${spec.commit.take(12)} from ${clone}")
            runCommand(['git', '-C', clone.path, 'archive', '-o', zip.path, spec.commit], projectDir)
        } else {
            def fetched = file("${src.path}-git")
            project.delete(fetched)
            fetched.mkdirs()
            logger.lifecycle("Fetching ${spec.commit.take(12)} from ${spec.repository}")
            runCommand(['git', 'init', '-q'], fetched)
            runCommand(['git', 'fetch', '-q', '--depth', '1', spec.repository, spec.commit], fetched)
            runCommand(['git', 'archive', '-o', zip.path, 'FETCH_HEAD'], fetched)
            project.delete(fetched)
        }
        project.copy { from project.zipTree(zip); into src }
    }
    logger.lifecycle("Building unreleased ${name} from ${spec.commit.take(12)} (first time only)")
    if (!(spec.loader in ['forge', 'neoforge'])) throw new GradleException('Source dependency requires a known legacy loader')
    def command = isWindows ? ['cmd', '/c', new File(src, 'gradlew.bat').absolutePath] : ['bash', 'gradlew']
    runCommand(command + ['--no-daemon', '--console=plain', '-q', "-Ploader=${spec.loader}", 'jar'], src)
    def built = new File(src, "build/${spec.loader}/libs/${name}")
    if (!built.isFile()) throw new GradleException("Source build did not produce ${built}")
    jar.parentFile.mkdirs()
    java.nio.file.Files.copy(built.toPath(), jar.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    marker.text = spec.commit + '\n'
}
def fetchDependencies = tasks.register('fetchDependencies') {
    group = 'build setup'
    description = 'Prepares the pinned Singulo, AE2 and GuideME JARs in libs/ (SHA-256 downloads or pinned source builds).'
    def selected = pinnedDependencies.findAll { name, spec -> !providers.gradleProperty(spec.property).isPresent() }
    def pinned = selected.findAll { name, spec -> spec.sha256 }
    def sourceBuilt = selected.findAll { name, spec -> spec.commit }
    def overrides = pinnedDependencies.findAll { name, spec -> providers.gradleProperty(spec.property).isPresent() }
        .collectEntries { name, spec -> [(spec.property): dependencyJar(name, spec)] }
    inputs.file('tools/dependencies.json')
    outputs.files(selected.keySet().collect { file("libs/${it}") })
    outputs.upToDateWhen { sourceBuilt.every { name, spec ->
        def marker = file("libs/${name}.commit")
        file("libs/${name}").isFile() && marker.isFile() && marker.text.trim() == spec.commit } }
    doLast {
        selected.each { name, spec ->
            if (!spec.sha256 && !spec.commit) throw new GradleException("Pending verified dependency ${name}; supply -P${spec.property}=<development-jar> for local port testing only")
        }
        overrides.each { property, jar ->
            if (!jar.isFile()) throw new GradleException("Missing -P${property}: ${jar}")
            logger.warn("Using unpinned -P${property}=${jar}; not valid for publication checks")
        }
        sourceBuilt.each { name, spec ->
            buildFromSource(name, spec)
            logger.warn("${name} is an UNRELEASED build of ${spec.commit.take(12)}; Applied Singulo built against it must not be published")
        }
        pinned.each { name, spec ->
            def jar = file("libs/${name}")
            if (!jar.isFile()) {
                logger.lifecycle("Downloading ${name} from ${spec.url}")
                jar.parentFile.mkdirs()
                def part = file("libs/${name}.part")
                def connection = new URL(spec.url).openConnection()
                connection.connectTimeout = 30000
                connection.readTimeout = 120000
                connection.setRequestProperty('User-Agent', 'Applied-Singulo-build')
                connection.inputStream.withCloseable { input -> part.withOutputStream { it << input } }
                if (!part.renameTo(jar)) throw new GradleException("Could not move ${part} to ${jar}")
            }
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            jar.withInputStream { input ->
                byte[] buffer = new byte[65536]
                for (int n = input.read(buffer); n > 0; n = input.read(buffer)) digest.update(buffer, 0, n)
            }
            def actual = digest.digest().encodeHex().toString()
            if (actual != spec.sha256) {
                jar.delete()
                throw new GradleException("SHA-256 mismatch for ${name}: ${actual}; deleted, refusing dependency")
            }
        }
    }
}
pinnedDependencies.each { name, spec ->
    def jarFile = dependencyJar(name, spec)
    repositories {
        exclusiveContent {
            forRepository { flatDir { dirs jarFile.parentFile } }
            filter { includeModule('local.pinned', jarFile.name - '.jar') }
        }
    }
    dependencies {
        modCompileOnly(group: 'local.pinned', name: jarFile.name - '.jar', version: '1', ext: 'jar')
        modRuntimeOnly(group: 'local.pinned', name: jarFile.name - '.jar', version: '1', ext: 'jar')
    }
}

legacyForge {
    if (selectedLoader == 'forge') version = "${minecraft_version}-${selectedLoaderVersion}"
    else enable { neoForgeVersion = "${minecraft_version}-${selectedLoaderVersion}" }
    runs {
        client {
            client()
            if (providers.gradleProperty('clientSmoke').isPresent()) {
                gameDirectory = layout.buildDirectory.dir('client-smoke')
                systemProperty 'applied_singulo.clientSmoke', 'true'
            }
        }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('gametest')
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
tasks.matching { it.name in ['runClient', 'runServer', 'runGameTestServer'] }.configureEach { dependsOn fetchDependencies }
tasks.named('compileJava') { dependsOn fetchDependencies }

// Legacy Forge launches through dedicated-server world generation, not vanilla's flat GameTest factory.
// Every invocation uses a new deterministic, test-only world; preserve prior worlds as diagnostic evidence.
def gameTestDirectory = layout.buildDirectory.dir('gametest')
def prepareGameTestWorld = tasks.register('prepareGameTestWorld') {
    outputs.upToDateWhen { false }
    doLast {
        def directory = gameTestDirectory.get().asFile
        directory.mkdirs()
        def worldName = 'applied-singulo-flat-' + java.util.UUID.randomUUID().toString()
        new File(directory, 'server.properties').setText("""# Generated only for Applied Singulo GameTests.
level-name=${worldName}
level-seed=1
level-type=minecraft:flat
generate-structures=false
generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains","lakes":false,"features":false,"structure_overrides":[]}
""", 'UTF-8')
        logger.lifecycle("Prepared deterministic flat GameTest world ${worldName}")
    }
}
tasks.named('runGameTestServer') { dependsOn prepareGameTestWorld }


def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def values = [minecraft_version_range: minecraft_version_range, forge_version: selectedLoaderVersion,
        loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name,
        mod_version: mod_version, mod_license: mod_license, mod_authors: mod_authors,
        singulo_version_range: singulo_version_range, ae2_version_range: ae2_version_range]
    inputs.properties values
    expand values
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.withType(net.neoforged.moddevgradle.legacyforge.tasks.RemapJar).configureEach {
    archiveFileName = "${mod_archive_name}-${mod_version}-${minecraft_version}${selectedSuffix}.jar"
}
tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '1000'] }
